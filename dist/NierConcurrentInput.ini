;;;;;;;;;; NierConcurrentInput ;;;;;;;;;;
; Lets keyboard/mouse and a controller be used at the same time.

[Concurrent Input]
; Stop the game from disabling the mouse while a controller is the active input
; device. The camera then uses the mouse whenever the mouse moved that frame and
; the right stick otherwise; every other controller input (left stick, buttons,
; triggers) keeps working in the same frame.
MouseAlwaysActive = true

; Same idea for the keyboard: the axis and button readers stop skipping their
; keyboard and mouse-button contribution while a controller is active, so WASD,
; the action keys and the mouse wheel all keep working alongside the pad.
;
; Where a stick and a key overlap the two values are added. This does not make
; anything faster -- movement is clamped to unit length and the camera curve
; saturates at full deflection -- but it does cost analog resolution: with W
; held, any nudge of the left stick is already past full tilt, so you get a
; flat-out run instead of a walk.
;
; Off by default: it is not needed for the mouse-look fix above, and it means a
; key you are resting a finger on now counts while you play on the pad.
KeyboardAlwaysActive = false

; Narrower alternative to MouseAlwaysActive: only make the *camera* ignore the
; active-device flag and leave menus/cursor handling completely alone. Does NOT
; restore mouse capture and cursor recentring while a controller is active, so
; the mouse will stop responding once the (invisible) cursor reaches a screen
; edge. Only useful for comparison; leave this off unless MouseAlwaysActive
; causes a problem.
CameraOnly = false

[Glyphs]
; Pin the on-screen button hints to one device instead of letting them flip
; every time you touch the other one.
;
;   none        leave the game's own switching alone
;   controller  always show controller glyphs and controller wording
;   keyboard    always show keyboard/mouse glyphs and wording
;
; Only the code that picks artwork and text is affected; menu mouse clicking
; and keyboard key-repeat still follow the device you actually used.
;
; This is unconditional -- "controller" shows controller icons even with no
; controller plugged in, and "keyboard" shows keyboard icons even if you never
; touch the keyboard.
ForceGlyphs = controller

[Debug]
; Write NierConcurrentInput.log next to the game exe on startup.
Logging = true
