;;;;;;;;;; NierConcurrentInput ;;;;;;;;;;
; Lets keyboard/mouse and a controller be used at the same time.

[Concurrent Input]
; Stop the game from disabling the mouse while a controller is the active input
; device. The camera then uses the mouse whenever the mouse moved that frame and
; the right stick otherwise; every other controller input (left stick, buttons,
; triggers) keeps working in the same frame. Controller button prompts are
; unaffected.
MouseAlwaysActive = true

; Narrower alternative: only make the *camera* ignore the active-device flag and
; leave menus/cursor handling completely alone. Does NOT restore mouse capture
; and cursor recentring while a controller is active, so the mouse will stop
; responding once the (invisible) cursor reaches a screen edge. Only useful for
; comparison; leave this off unless MouseAlwaysActive causes a problem.
CameraOnly = false

[Debug]
; Write NierConcurrentInput.log next to the game exe on startup.
Logging = true
