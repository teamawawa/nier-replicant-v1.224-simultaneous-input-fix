;;;;;;;;;; NierConcurrentInput ;;;;;;;;;;
; Lets keyboard/mouse and a controller be used at the same time.
; https://github.com/teamawawa/nier-replicant-v1.224-simultaneous-input-fix
; https://www.nexusmods.com/nierreplicant/mods/123

[Concurrent Input]
; Stop the game from disabling the mouse while a controller is the active input
; device.
MouseAlwaysActive = true

; Stop the game from disabling the keyboard while a controller is the active input
; device.
;
; Off by default: tested less rigorously and not needed for core functionality.
; Open a github issue or leave a nexusmods comment if you run into a bug.
KeyboardAlwaysActive = false

; Alternative to MouseAlwaysActive to only enable mouse controls for camera (vs menu etc).
;
; Only useful for comparison, leave this off unless MouseAlwaysActive
; causes a problem.
CameraOnly = false

[Glyphs]
; Pin the on-screen button hints to one device instead of changing on every input.
;
;   none        leave the game's own switching alone
;   controller  always show controller glyphs and controller wording
;   keyboard    always show keyboard/mouse glyphs and wording
;
; Not rigorously tested, enable at your own risk.
; Open a github issue or leave a nexusmods comment if you run into a bug.
ForceGlyphs = none

[Debug]
; Write NierConcurrentInput.log next to the game exe on startup.
Logging = true

; Diagnostic for ForceGlyphs, which tries to only patch artwork-related reads
; rather than behavioural ones (menu mouse clicking, keyboard key-repeat, rumble).
; This changes all of them for debugging purposes.
;
; Not meant for playing: with it on, mouse control of menus and keyboard
; key-repeat follow the forced device instead of the one you are using.
PinAllDeviceReads = false
